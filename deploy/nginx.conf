# Sitio estático. Reemplazar DOMINIO. Instalar en /etc/nginx/sites-available/costopolitico,
# enlazar en sites-enabled y luego: sudo certbot --nginx -d DOMINIO
server {
    listen 80;
    server_name DOMINIO;
    root /var/www/costopolitico;
    index index.html;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

    location = /data.json {
        add_header Cache-Control "public, max-age=3600";
        gzip on;
        gzip_types application/json;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
